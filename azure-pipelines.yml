# Online Quiz System - Azure DevOps Pipeline
# CI/CD Pipeline for build, test, and deployment

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**

pr:
  branches:
    include:
      - main
      - develop

variables:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'
  BUILD_CONFIGURATION: 'Release'
  APP_NAME: 'online-quiz-system'
  CONTAINER_REGISTRY: 'yourregistry.azurecr.io'
  IMAGE_TAG: '$(Build.BuildId)'

stages:

# ─────────────────────────────────────────────────
# STAGE 1: Build & Code Quality
# ─────────────────────────────────────────────────
- stage: Build
  displayName: 'Build & Code Quality'
  jobs:

  - job: BuildFrontend
    displayName: 'Build Frontend (React Quiz UI)'
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Install Node.js'

    - script: |
        cd frontend
        npm ci
        npm run lint
        npm run build
      displayName: 'Install, Lint & Build Frontend'

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: 'frontend/dist'
        artifactName: 'frontend-build'
      displayName: 'Publish Frontend Artifact'

  - job: BuildBackend
    displayName: 'Build Backend (Quiz API)'
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)
      displayName: 'Use Python $(PYTHON_VERSION)'

    - script: |
        cd backend
        pip install -r requirements.txt
        pip install flake8 black
        flake8 . --max-line-length=100
        black --check .
      displayName: 'Install Dependencies & Lint Backend'

    - script: |
        cd backend
        python -m build
      displayName: 'Build Backend Package'

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: 'backend/dist'
        artifactName: 'backend-build'
      displayName: 'Publish Backend Artifact'

# ─────────────────────────────────────────────────
# STAGE 2: Test
# ─────────────────────────────────────────────────
- stage: Test
  displayName: 'Run Tests'
  dependsOn: Build
  jobs:

  - job: UnitTests
    displayName: 'Unit Tests'
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-cov
        pytest tests/unit/ \
          --junitxml=test-results/unit-results.xml \
          --cov=app \
          --cov-report=xml:coverage.xml \
          --cov-fail-under=80
      displayName: 'Run Backend Unit Tests'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'backend/test-results/unit-results.xml'
      displayName: 'Publish Unit Test Results'

    - task: PublishCodeCoverageResults@1
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: 'backend/coverage.xml'
      displayName: 'Publish Code Coverage'

  - job: IntegrationTests
    displayName: 'Integration Tests'
    pool:
      vmImage: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: quizuser
          POSTGRES_PASSWORD: quizpass
          POSTGRES_DB: quizdb
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
    - script: |
        cd backend
        pip install -r requirements.txt
        pytest tests/integration/ \
          --junitxml=test-results/integration-results.xml
      env:
        DATABASE_URL: 'postgresql://quizuser:quizpass@localhost:5432/quizdb'
        REDIS_URL: 'redis://localhost:6379'
      displayName: 'Run Integration Tests'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'backend/test-results/integration-results.xml'
      displayName: 'Publish Integration Test Results'

  - job: FrontendTests
    displayName: 'Frontend Tests'
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)

    - script: |
        cd frontend
        npm ci
        npm test -- --watchAll=false --coverage \
          --coverageReporters=cobertura \
          --coverageDirectory=coverage
      displayName: 'Run Frontend Unit Tests'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'frontend/coverage/junit.xml'
      displayName: 'Publish Frontend Test Results'

# ─────────────────────────────────────────────────
# STAGE 3: Security & SAST
# ─────────────────────────────────────────────────
- stage: Security
  displayName: 'Security Scan'
  dependsOn: Build
  jobs:

  - job: DependencyScan
    displayName: 'Dependency Vulnerability Scan'
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        pip install safety
        cd backend && safety check -r requirements.txt
      displayName: 'Scan Python Dependencies'

    - script: |
        cd frontend && npm audit --audit-level=high
      displayName: 'Scan Node.js Dependencies'

  - job: SASTScan
    displayName: 'Static Application Security Testing'
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: MicrosoftSecurityDevOps@1
      displayName: 'Run Microsoft Security DevOps'

# ─────────────────────────────────────────────────
# STAGE 4: Docker Build & Push
# ─────────────────────────────────────────────────
- stage: ContainerBuild
  displayName: 'Build & Push Docker Images'
  dependsOn:
    - Test
    - Security
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:

  - job: BuildAndPushImages
    displayName: 'Build & Push to ACR'
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: 'Build & Push Frontend Image'
      inputs:
        containerRegistry: 'AzureContainerRegistry'
        repository: '$(APP_NAME)/frontend'
        command: buildAndPush
        Dockerfile: 'frontend/Dockerfile'
        tags: |
          $(IMAGE_TAG)
          latest

    - task: Docker@2
      displayName: 'Build & Push Backend Image'
      inputs:
        containerRegistry: 'AzureContainerRegistry'
        repository: '$(APP_NAME)/backend'
        command: buildAndPush
        Dockerfile: 'backend/Dockerfile'
        tags: |
          $(IMAGE_TAG)
          latest

# ─────────────────────────────────────────────────
# STAGE 5: Deploy to Staging
# ─────────────────────────────────────────────────
- stage: DeployStaging
  displayName: 'Deploy to Staging'
  dependsOn: ContainerBuild
  condition: succeeded()
  jobs:

  - deployment: DeployToStaging
    displayName: 'Deploy Quiz System to Staging'
    environment: 'quiz-staging'
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Deploy to Azure App Service (Staging)'
            inputs:
              azureSubscription: 'AzureServiceConnection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az webapp config container set \
                  --name $(APP_NAME)-staging \
                  --resource-group quiz-rg \
                  --docker-custom-image-name $(CONTAINER_REGISTRY)/$(APP_NAME)/backend:$(IMAGE_TAG)

          - task: AzureCLI@2
            displayName: 'Run Database Migrations'
            inputs:
              azureSubscription: 'AzureServiceConnection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az webapp ssh --name $(APP_NAME)-staging \
                  --resource-group quiz-rg \
                  --command "python manage.py migrate"

  - job: SmokeTests
    displayName: 'Staging Smoke Tests'
    dependsOn: DeployToStaging
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        # Verify quiz API is healthy
        curl -f https://$(APP_NAME)-staging.azurewebsites.net/api/health || exit 1
        # Verify quiz endpoint responds
        curl -f https://$(APP_NAME)-staging.azurewebsites.net/api/quizzes/ || exit 1
        # Verify leaderboard endpoint
        curl -f https://$(APP_NAME)-staging.azurewebsites.net/api/leaderboard/ || exit 1
      displayName: 'Run API Smoke Tests'

# ─────────────────────────────────────────────────
# STAGE 6: Deploy to Production
# ─────────────────────────────────────────────────
- stage: DeployProduction
  displayName: 'Deploy to Production'
  dependsOn: DeployStaging
  condition: succeeded()
  jobs:

  - deployment: DeployToProduction
    displayName: 'Deploy Quiz System to Production'
    environment: 'quiz-production'   # Requires manual approval gate
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Deploy Backend to Production'
            inputs:
              azureSubscription: 'AzureServiceConnection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az webapp config container set \
                  --name $(APP_NAME) \
                  --resource-group quiz-rg \
                  --docker-custom-image-name $(CONTAINER_REGISTRY)/$(APP_NAME)/backend:$(IMAGE_TAG)

          - task: AzureCLI@2
            displayName: 'Run Production Migrations'
            inputs:
              azureSubscription: 'AzureServiceConnection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az webapp ssh --name $(APP_NAME) \
                  --resource-group quiz-rg \
                  --command "python manage.py migrate --no-input"

          - script: |
              echo "##[section]Deployment Summary"
              echo "App: $(APP_NAME)"
              echo "Build: $(IMAGE_TAG)"
              echo "Branch: $(Build.SourceBranchName)"
              echo "Triggered by: $(Build.RequestedFor)"
            displayName: 'Print Deployment Summary'
